name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Secrets:
#   CLOUDFLARE_API_TOKEN   required (Workers Scripts Edit + D1 Edit)
#   CLOUDFLARE_ACCOUNT_ID  required
#   CF_D1_DATABASE_ID      required if wrangler.toml is not committed
#
# Runtime secrets (not in GitHub):
#   pnpm exec wrangler secret put ADMIN_PASSWORD
#   pnpm exec wrangler secret put COOKIE_SECRET

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure wrangler.toml
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [ -f wrangler.toml ]; then
            echo "Using committed wrangler.toml"
          else
            if [ -z "${CF_D1_DATABASE_ID:-}" ]; then
              echo "::error::Missing wrangler.toml and secret CF_D1_DATABASE_ID"
              exit 1
            fi
            sed "s/REPLACE_WITH_YOUR_DATABASE_ID/${CF_D1_DATABASE_ID}/g" \
              wrangler.toml.example > wrangler.toml
            echo "Generated wrangler.toml from example"
          fi

          if grep -q 'REPLACE_WITH_YOUR_DATABASE_ID' wrangler.toml; then
            echo "::error::wrangler.toml still contains REPLACE_WITH_YOUR_DATABASE_ID"
            exit 1
          fi

          echo "----- wrangler.toml -----"
          cat wrangler.toml

      - name: Typecheck
        run: pnpm run build

      - name: Cloudflare auth diagnostic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          pnpm exec wrangler whoami

          set +e
          pnpm exec wrangler d1 list
          d1_code=$?
          set -e
          if [ "$d1_code" -ne 0 ]; then
            echo "::warning::wrangler d1 list failed (exit $d1_code)."
            echo "Token can authenticate (whoami OK) but likely lacks Account → D1 → Edit."
            echo "Recreate token from https://dash.cloudflare.com/profile/api-tokens"
            echo "Use template 'Edit Cloudflare Workers' and explicitly add Account → D1 → Edit."
            echo "Also verify CLOUDFLARE_ACCOUNT_ID matches the account that owns the D1 database."
          else
            echo "D1 list OK"
          fi

      # Existing remote DBs may already be migrated. Migration failure must not block Worker deploy.
      # wrangler d1 migrations apply expects database_name or binding from wrangler.toml — NOT database_id UUID.
      - name: Apply D1 migrations (remote)
        id: migrate
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME=$(python3 - <<'PY'
          import re
          text=open('wrangler.toml',encoding='utf-8').read()
          m=re.search(r'database_name\s*=\s*"([^"]+)"', text)
          print(m.group(1) if m else 'outlook-email-db')
          PY
          )
          DB_BINDING=$(python3 - <<'PY'
          import re
          text=open('wrangler.toml',encoding='utf-8').read()
          # first binding under d1_databases block is enough for this project
          m=re.search(r'\[\[d1_databases\]\][\s\S]*?binding\s*=\s*"([^"]+)"', text)
          if not m:
            m=re.search(r'binding\s*=\s*"([^"]+)"', text)
          print(m.group(1) if m else 'DB')
          PY
          )
          DB_ID=$(python3 - <<'PY'
          import re
          text=open('wrangler.toml',encoding='utf-8').read()
          m=re.search(r'database_id\s*=\s*"([^"]+)"', text)
          print(m.group(1) if m else '')
          PY
          )
          echo "database_name=$DB_NAME"
          echo "binding=$DB_BINDING"
          echo "database_id=$DB_ID"
          echo "Applying migrations by database_name (wrangler does not accept database_id UUID here)..."
          set +e
          pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Retrying migrations by binding name..."
            pnpm exec wrangler d1 migrations apply "$DB_BINDING" --remote
            code=$?
          fi
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::D1 migration failed with exit $code (will still deploy worker code)"
            echo "Common causes:"
            echo "  1) CLOUDFLARE_API_TOKEN missing Account → D1 → Edit"
            echo "  2) CF_D1_DATABASE_ID / wrangler.toml database_id is wrong for this account"
            echo "  3) D1 database does not exist yet — create it once locally, then set CF_D1_DATABASE_ID"
            exit "$code"
          fi
          echo "D1 migration ok"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy

      - name: Migration warning
        if: steps.migrate.outcome == 'failure'
        run: |
          echo "::warning::Worker deployed, but D1 migration failed."
          echo "If this is an existing production DB, migration failure is often OK."
          echo "Check CLOUDFLARE_API_TOKEN has Account → D1 → Edit."
          echo "Check CF_D1_DATABASE_ID / wrangler.toml database_id is correct."
          echo "wrangler d1 migrations apply must use database_name (e.g. outlook-email-db) or binding (DB), not the UUID."
